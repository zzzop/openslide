name: Sync and Build CSP OpenSlide

on:
  schedule:
    - cron: '0 2 * * *' # 每天凌晨2点自动检查更新
  workflow_dispatch:      # 允许你点击按钮手动触发
  push:
    branches: [ vendor-csp ] # 当代码有变动时触发
permissions:
  contents: write

jobs:
  sync:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout your fork
          uses: actions/checkout@v4
          with:
            token: ${{ secrets.GITHUB_TOKEN }}
            ref: vendor-csp       # 切换到你的 vendor-csp 分支
            fetch-depth: 0        # 获取所有历史记录，同步必选
  
        - name: Sync with Upstream
          run: |
            # 配置 git 用户信息
            git config --global user.name 'GitHub Action'
            git config --global user.email 'action@github.com'
            
            # 添加原作者的仓库作为远程源 (upstream)
            git remote add upstream https://github.com/bryandeng/openslide.git
            
            # 拉取原作者的所有分支
            git fetch upstream
            
            # 将原作者的 vendor-csp 分支合并到你的分支
            # 如果有冲突，这里会报错，但对于 Fork 仓库通常很顺畅
            git merge upstream/vendor-csp
            
            # 推送更新回你的 GitHub 仓库
            git push origin vendor-csp

  build-linux:
    needs: sync # 等同步完成后再开始编译
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vendor-csp

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libjpeg-turbo8-dev libtiff5-dev \
          libglib2.0-dev libcairo2-dev libgdk-pixbuf2.0-dev libxml2-dev \
          libsqlite3-dev libopenjp2-7-dev libzstd-dev

      - name: Configure and Build
        run: |
          meson setup builddir
          meson compile -C builddir

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openslide-linux-csp
          path: builddir/src/libopenslide.so* # 编译出的库文件
