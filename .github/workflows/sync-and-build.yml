name: Sync and Build CSP OpenSlide

on:
  schedule:
    - cron: '0 2 * * *' # 每天凌晨2点自动检查更新
  workflow_dispatch:      # 允许你点击按钮手动触发
  push:
    branches: [ vendor-csp ] # 当代码有变动时触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync with Upstream
        uses: repo-sync/github-sync@v2
        with:
          source_repo: "https://github.com/bryandeng/openslide.git"
          source_branch: "vendor-csp"
          destination_branch: "vendor-csp"
          github_token: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    needs: sync # 等同步完成后再开始编译
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vendor-csp

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libjpeg-turbo8-dev libtiff5-dev \
          libglib2.0-dev libcairo2-dev libgdk-pixbuf2.0-dev libxml2-dev \
          libsqlite3-dev libopenjp2-7-dev libzstd-dev

      - name: Configure and Build
        run: |
          meson setup builddir
          meson compile -C builddir

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openslide-linux-csp
          path: builddir/src/libopenslide.so* # 编译出的库文件
